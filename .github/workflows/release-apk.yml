name: Signed Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag name (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-signed-release-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Pre-installed Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          STORE_PASS="${SECRET_STORE_PASSWORD:-aeroglass_release_pass}"
          KEY_PASS="${SECRET_KEY_PASSWORD:-$STORE_PASS}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > "$KEYSTORE_FILE"
          elif [ -f "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            echo "Using existing repository my-upload-key.jks..."
          elif [ -f "${GITHUB_WORKSPACE}/my-upload-key.jks.base64" ]; then
            echo "Decoding repository my-upload-key.jks.base64..."
            base64 --decode "${GITHUB_WORKSPACE}/my-upload-key.jks.base64" > "$KEYSTORE_FILE"
          else
            echo "Generating release signing key (alias: upload)..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=AeroGlass Release, OU=Mobile, O=AeroGlass, L=San Francisco, S=CA, C=US"
          fi
          # Also ensure a copy exists in app/ in case referenced relative to app/
          cp -f "$KEYSTORE_FILE" "${GITHUB_WORKSPACE}/app/my-upload-key.jks" || true
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Ensure debug.keystore Exists for Gradle Configuration
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Ensure app/google-services.json Exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "Synthesizing app/google-services.json for CI..."
            python3 -c '
          import json
          data = {
              "project_info": {
                  "project_number": "574199975202",
                  "project_id": "gen-lang-client-0895456119",
                  "storage_bucket": "gen-lang-client-0895456119.firebasestorage.app"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:574199975202:android:af438b509cd61fa448a97b",
                      "android_client_info": {
                          "package_name": "com.aistudio.aeroglass.vxpqmn"
                      }
                  },
                  "oauth_client": [{
                      "client_id": "574199975202-u9nrs7f23nlduo6uqkjuu42fs01p2475.apps.googleusercontent.com",
                      "client_type": 3
                  }],
                  "api_key": [{
                      "current_key": "AIzaSyCiBuildKeyForGoogleServicesMock"
                  }],
                  "services": {
                      "appinvite_service": {
                          "other_platform_oauth_client": []
                      }
                  }
              }],
              "configuration_version": "1"
          }
          with open("app/google-services.json", "w") as f:
              json.dump(data, f, indent=2)
          '
          fi

      - name: Build Signed Release APK Only
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PASSWORD || secrets.STORE_PASSWORD || 'aeroglass_release_pass' }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD || env.STORE_PASSWORD || 'aeroglass_release_pass' }}
        run: |
          chmod +x ./gradlew || true
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -Dandroid.builder.sdkDownload=true

      - name: Locate & Stage Signed APK
        id: apk
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Signed Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          SIGNED_APK="app/build/outputs/apk/release/AeroGlass-release-signed.apk"
          cp "$APK_SOURCE" "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$SIGNED_APK"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroGlass-release-signed-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with Signed APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "AeroGlass ${{ steps.tag.outputs.tag_name }} (Signed APK)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk_path }}
