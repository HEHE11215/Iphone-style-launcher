name: Signed Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag name (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-signed-release-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Pre-installed Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Prepare Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="${SECRET_STORE_PASSWORD:-aeroglass_release_pass}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$STORE_PASS}"
          else
            echo "No KEYSTORE_BASE64 secret found; generating release signing key (alias: upload)..."
            STORE_PASS="${SECRET_STORE_PASSWORD:-aeroglass_release_pass}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$STORE_PASS}"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=AeroGlass Release, OU=Mobile, O=AeroGlass, L=San Francisco, S=CA, C=US"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Ensure debug.keystore Exists for Gradle Configuration
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Signed Release APK Only
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate & Stage Signed APK
        id: apk
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Signed Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          SIGNED_APK="app/build/outputs/apk/release/AeroGlass-release-signed.apk"
          cp "$APK_SOURCE" "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$SIGNED_APK"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroGlass-release-signed-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "AeroGlass ${{ steps.tag.outputs.tag_name }} (Signed APK)"
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk_path }}
